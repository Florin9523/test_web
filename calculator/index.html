<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Abac Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#E4E7EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abac">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-screen instrument — top bar, display window, optional scientific bank, main keypad */
:root {
  --bg: #E4E7EB;
  --panel: #F3F5F7;
  --fg: #1B2430;
  --muted: #6B7785;
  --key: #FFFFFF;
  --key-press: #E3E8EE;
  --fn: #D3DAE2;
  --fn-press: #C1CAD4;
  --op: #1F4E5F;
  --op-press: #173D4A;
  --op-fg: #FFFFFF;
  --accent: #D9692A;
  --accent-press: #B85620;
  --accent-fg: #FFFFFF;
  --line: #CBD2DA;
  --shadow: 0 1px 0 rgba(27, 36, 48, .12);
  --font-num: "Red Hat Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-ui: "Red Hat Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171D; --panel: #1A2129; --fg: #E8EDF2; --muted: #8796A5;
    --key: #232C36; --key-press: #2D3844; --fn: #2E3945; --fn-press: #3A4755;
    --op: #2F6F85; --op-press: #275D70; --op-fg: #FFFFFF;
    --accent: #EE8840; --accent-press: #D27330; --accent-fg: #1A1006;
    --line: #2A333D; --shadow: 0 1px 0 rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171D; --panel: #1A2129; --fg: #E8EDF2; --muted: #8796A5;
  --key: #232C36; --key-press: #2D3844; --fn: #2E3945; --fn-press: #3A4755;
  --op: #2F6F85; --op-press: #275D70; --op-fg: #FFFFFF;
  --accent: #EE8840; --accent-press: #D27330; --accent-fg: #1A1006;
  --line: #2A333D; --shadow: 0 1px 0 rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 14px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
  position: relative;
}

/* Top bar */
.bar { display: flex; align-items: center; gap: 10px; }
.brand {
  font-family: var(--font-num);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: auto;
}
.seg {
  display: inline-flex;
  background: var(--fn);
  border-radius: 999px;
  padding: 3px;
}
.seg button {
  border: 0;
  background: transparent;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--key); color: var(--fg); box-shadow: var(--shadow); }
.icon-btn {
  border: 0;
  background: var(--fn);
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Display */
.screen {
  flex: 1 1 auto;
  min-height: 112px;
  background: var(--panel);
  border-radius: 18px;
  padding: 12px 16px 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.status {
  position: absolute; top: 12px; left: 16px;
  display: flex; gap: 6px;
  font-family: var(--font-num);
  font-size: 11px;
  letter-spacing: .08em;
}
.chip { padding: 2px 7px; border-radius: 6px; background: var(--fn); color: var(--muted); }
.chip.on { background: var(--op); color: var(--op-fg); }
.expr, .result {
  font-family: var(--font-num);
  text-align: right;
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  min-width: 0;
}
.expr::-webkit-scrollbar, .result::-webkit-scrollbar { display: none; }
.expr { font-size: var(--fs-expr, 40px); color: var(--fg); transition: font-size .12s ease; }
.result { font-size: 22px; color: var(--muted); min-height: 1.15em; cursor: pointer; transition: font-size .12s ease; }
.screen.done .expr { font-size: 20px; color: var(--muted); }
.screen.done .result { font-size: var(--fs-res, 48px); color: var(--fg); font-weight: 500; }
.result.err { color: var(--accent); }
.expr .o { color: var(--accent); padding: 0 .08em; }
.expr .f { color: var(--op); }
.expr .p { color: var(--muted); }
.expr .ghost { color: var(--line); }
.caret {
  display: inline-block; width: 2px; height: .95em; margin-left: 2px;
  background: var(--accent); vertical-align: -0.1em;
  animation: blink 1.1s steps(1) infinite;
}
.screen.done .caret { display: none; }
@keyframes blink { 50% { opacity: 0; } }

/* Keys */
.pad { display: grid; gap: 8px; }
.sci { grid-template-columns: repeat(5, 1fr); grid-auto-rows: clamp(36px, 5.6vh, 50px); gap: 7px; }
.main { grid-template-columns: repeat(4, 1fr); grid-auto-rows: clamp(52px, 9.2vh, 78px); }
.app.sci-on .main { grid-auto-rows: clamp(46px, 7.4vh, 66px); }
.k {
  border: 0;
  border-radius: 14px;
  background: var(--key);
  box-shadow: var(--shadow);
  font-size: 24px;
  font-family: var(--font-num);
  cursor: pointer;
  touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
  transition: transform .06s ease, background-color .1s ease;
  min-width: 0;
}
.k:active, .k.pressed { transform: scale(.96); background: var(--key-press); }
.k.fn { background: var(--fn); font-size: 20px; }
.k.fn:active, .k.fn.pressed { background: var(--fn-press); }
.k.op { background: var(--op); color: var(--op-fg); font-size: 28px; }
.k.op:active, .k.op.pressed { background: var(--op-press); }
.k.eq { background: var(--accent); color: var(--accent-fg); font-size: 30px; }
.k.eq:active, .k.eq.pressed { background: var(--accent-press); }
.sci .k { font-size: 15px; border-radius: 11px; background: var(--fn); font-family: var(--font-ui); font-weight: 500; }
.sci .k:active, .sci .k.pressed { background: var(--fn-press); }
.sci .k.toggle[aria-pressed="true"] { background: var(--op); color: var(--op-fg); }
.sci .k sup { font-size: .68em; line-height: 0; position: relative; top: -.1em; }
.k svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* History sheet */
.sheet {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  top: 58px;
  bottom: 14px;
  background: var(--panel);
  border-radius: 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
  display: flex; flex-direction: column;
  z-index: 5;
  overflow: hidden;
}
.sheet header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
}
.sheet h2 { margin: 0; font-size: 16px; font-weight: 700; }
.sheet .actions { display: flex; gap: 8px; }
.txt-btn {
  border: 0; background: var(--fn); border-radius: 999px;
  padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.hist { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; -webkit-user-select: text; user-select: text; }
.hist li { border-bottom: 1px solid var(--line); }
.hist button {
  width: 100%; text-align: right; border: 0; background: transparent;
  padding: 12px 16px; cursor: pointer; display: grid; gap: 2px;
  font-family: var(--font-num);
}
.hist button:active { background: var(--fn); }
.hist .he { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.hist .hr { font-size: 20px; font-weight: 500; }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; line-height: 1.5; }

.toast {
  position: absolute; left: 50%; top: 64px; transform: translateX(-50%);
  background: var(--fg); color: var(--bg);
  padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
  opacity: 0; transition: opacity .2s ease; pointer-events: none; z-index: 9;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <span class="brand">Abac</span>
    <div class="seg" role="group" aria-label="Mod calculator">
      <button type="button" id="modeClassic" aria-pressed="true">Clasic</button>
      <button type="button" id="modeSci" aria-pressed="false">Științific</button>
    </div>
    <button type="button" class="icon-btn" id="histBtn" aria-label="Istoric">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/></svg>
    </button>
  </div>

  <div class="screen" id="screen">
    <div class="status" id="status">
      <span class="chip" id="angleChip">DEG</span>
      <span class="chip" id="secondChip" hidden>2nd</span>
    </div>
    <div class="expr" id="expr" aria-live="polite"></div>
    <div class="result" id="result" title="Atinge pentru a copia"></div>
  </div>

  <div class="pad sci" id="sciPad" hidden>
    <button type="button" class="k toggle" data-act="second" aria-pressed="false">2nd</button>
    <button type="button" class="k" data-act="angle" id="angleKey">RAD</button>
    <button type="button" class="k" data-t="(">(</button>
    <button type="button" class="k" data-t=")">)</button>
    <button type="button" class="k" data-t="!">x!</button>

    <button type="button" class="k" data-t="sin(" data-t2="sin⁻¹(" data-l2="sin<sup>−1</sup>">sin</button>
    <button type="button" class="k" data-t="cos(" data-t2="cos⁻¹(" data-l2="cos<sup>−1</sup>">cos</button>
    <button type="button" class="k" data-t="tan(" data-t2="tan⁻¹(" data-l2="tan<sup>−1</sup>">tan</button>
    <button type="button" class="k" data-t="ln(" data-t2="e^(" data-l2="e<sup>x</sup>">ln</button>
    <button type="button" class="k" data-t="log(" data-t2="10^(" data-l2="10<sup>x</sup>">log</button>

    <button type="button" class="k" data-t="π">π</button>
    <button type="button" class="k" data-t="e">e</button>
    <button type="button" class="k" data-t="√(" data-t2="∛(" data-l2="∛x">√x</button>
    <button type="button" class="k" data-t="²" data-t2="³" data-l2="x<sup>3</sup>">x<sup>2</sup></button>
    <button type="button" class="k" data-t="^" data-t2="ʸ√" data-l2="<sup>y</sup>√x">x<sup>y</sup></button>

    <button type="button" class="k" data-t="⁻¹">1/x</button>
    <button type="button" class="k" data-t="E">EXP</button>
    <button type="button" class="k" data-t="Ans">Ans</button>
    <button type="button" class="k" data-t="abs(">|x|</button>
    <button type="button" class="k" data-act="rand">Rnd</button>
  </div>

  <div class="pad main" id="mainPad">
    <button type="button" class="k fn" data-act="clear" id="clearKey">AC</button>
    <button type="button" class="k fn" data-act="neg">±</button>
    <button type="button" class="k fn" data-t="%">%</button>
    <button type="button" class="k op" data-t="÷">÷</button>

    <button type="button" class="k" data-t="7">7</button>
    <button type="button" class="k" data-t="8">8</button>
    <button type="button" class="k" data-t="9">9</button>
    <button type="button" class="k op" data-t="×">×</button>

    <button type="button" class="k" data-t="4">4</button>
    <button type="button" class="k" data-t="5">5</button>
    <button type="button" class="k" data-t="6">6</button>
    <button type="button" class="k op" data-t="−">−</button>

    <button type="button" class="k" data-t="1">1</button>
    <button type="button" class="k" data-t="2">2</button>
    <button type="button" class="k" data-t="3">3</button>
    <button type="button" class="k op" data-t="+">+</button>

    <button type="button" class="k" data-t="0">0</button>
    <button type="button" class="k" data-t=".">,</button>
    <button type="button" class="k fn" data-act="back" aria-label="Șterge ultimul">
      <svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
    </button>
    <button type="button" class="k eq" data-act="eq">=</button>
  </div>

  <section class="sheet" id="sheet" hidden aria-label="Istoric calcule">
    <header>
      <h2>Istoric</h2>
      <div class="actions">
        <button type="button" class="txt-btn" id="histClear">Golește</button>
        <button type="button" class="txt-btn" id="histClose">Închide</button>
      </div>
    </header>
    <ul class="hist" id="histList"></ul>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Token classes ----------
  const BIN = new Set(['+', '−', '×', '÷', '^', 'ʸ√']);
  const POST = new Set(['!', '%', '²', '³', '⁻¹']);
  const CONST = new Set(['π', 'e', 'Ans']);
  const FUNCS = new Set(['sin(', 'cos(', 'tan(', 'sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(', 'ln(', 'log(', '√(', '∛(', 'abs(', 'e^(', '10^(']);
  const isNumChar = t => /^[0-9.]$/.test(t) || t === 'E';
  const isFunc = t => FUNCS.has(t);
  const opensValue = t => isNumChar(t) || CONST.has(t) || isFunc(t) || t === '(';
  const endsValue = t => t !== undefined && (/^[0-9.]$/.test(t) || CONST.has(t) || t === ')' || POST.has(t));

  // ---------- State ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('abac.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('abac.' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } }
  };
  let tokens = [];
  let done = false;            // true right after "="
  let lastResult = null;       // shown big after "="
  let ans = store.get('ans', 0);
  let deg = store.get('deg', true);
  let second = false;
  let mode = store.get('mode', 'classic');
  let history = store.get('history', [
    { e: '12×(7+5)', r: '144' },
    { e: '√(2)', r: '1,41421356237' }
  ]);

  // ---------- Math helpers ----------
  const toRad = x => deg ? x * Math.PI / 180 : x;
  const fromRad = x => deg ? x * 180 / Math.PI : x;
  const snap = x => (Math.abs(x) < 1e-12 ? 0 : x);
  const isMult = (x, m) => Math.abs(x / m - Math.round(x / m)) < 1e-12;

  function gamma(z) {
    if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
    const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
      -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    z -= 1;
    let x = c[0];
    for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
    const t = z + g + 0.5;
    return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
  }
  function factorial(n) {
    if (Number.isInteger(n)) {
      if (n < 0) throw new Error('domain');
      if (n > 170) return Infinity;
      let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
    }
    return gamma(n + 1);
  }
  function power(b, e) {
    if (b < 0 && !Number.isInteger(e)) {
      const inv = 1 / e, k = Math.round(inv);
      if (Math.abs(inv - k) < 1e-9 && k % 2 !== 0) return -Math.pow(-b, e);
    }
    return Math.pow(b, e);
  }
  function domain(v) { if (Number.isNaN(v)) throw new Error('domain'); return v; }

  const FN = {
    'sin(': x => { if (deg && isMult(x, 180)) return 0; return snap(Math.sin(toRad(x))); },
    'cos(': x => { if (deg && isMult(x - 90, 180)) return 0; return snap(Math.cos(toRad(x))); },
    'tan(': x => {
      if (deg && isMult(x, 180)) return 0;
      if (deg && isMult(x - 90, 180)) throw new Error('domain');
      return snap(Math.tan(toRad(x)));
    },
    'sin⁻¹(': x => fromRad(domain(Math.asin(x))),
    'cos⁻¹(': x => fromRad(domain(Math.acos(x))),
    'tan⁻¹(': x => fromRad(Math.atan(x)),
    'ln(': x => domain(x <= 0 ? NaN : Math.log(x)),
    'log(': x => domain(x <= 0 ? NaN : Math.log10(x)),
    '√(': x => domain(Math.sqrt(x)),
    '∛(': x => Math.cbrt(x),
    'abs(': x => Math.abs(x),
    'e^(': x => Math.exp(x),
    '10^(': x => Math.pow(10, x)
  };

  // ---------- Lexer + recursive-descent parser (no eval) ----------
  function lex(ts) {
    const out = [];
    for (let i = 0; i < ts.length; i++) {
      const t = ts[i];
      if (isNumChar(t)) {
        let s = '';
        while (i < ts.length && (isNumChar(ts[i]) || (ts[i] === '−' && ts[i - 1] === 'E'))) {
          s += ts[i] === '−' ? '-' : ts[i]; i++;
        }
        i--;
        if (!/^(\d+\.?\d*|\.\d+)(E-?\d+)?$/.test(s)) throw new Error('syntax');
        out.push({ k: 'num', v: parseFloat(s.replace('E', 'e')) });
      } else out.push({ k: t });
    }
    return out;
  }

  function evaluate(ts) {
    const L = lex(ts);
    let i = 0;
    const peek = () => L[i] && L[i].k;
    const startsPrimary = k => k === 'num' || CONST.has(k) || isFunc(k) || k === '(';

    function expr() {
      let left = term();
      while (peek() === '+' || peek() === '−') {
        const op = L[i++].k;
        const r = term();
        let v;
        if (r.pct) v = op === '+' ? left.v * (1 + r.v) : left.v * (1 - r.v);  // 50+10% = 55
        else v = op === '+' ? left.v + r.v : left.v - r.v;
        left = { v, pct: false };
      }
      return left;
    }
    function term() {
      let left = unary();
      for (;;) {
        const k = peek();
        if (k === '×' || k === '÷') {
          i++;
          const r = unary();
          if (k === '÷' && r.v === 0) throw new Error('div0');
          left = { v: k === '×' ? left.v * r.v : left.v / r.v, pct: false };
        } else if (k && startsPrimary(k)) {
          left = { v: left.v * unary().v, pct: false };   // implicit ×, e.g. 2π, 3(4)
        } else return left;
      }
    }
    function unary() {
      if (peek() === '−') { i++; const r = unary(); return { v: -r.v, pct: r.pct }; }
      if (peek() === '+') { i++; return unary(); }
      return pow();
    }
    function pow() {
      const b = postfix();
      if (peek() === '^') { i++; const e = unary(); return { v: power(b.v, e.v), pct: false }; }
      if (peek() === 'ʸ√') {
        i++; const y = unary();
        if (y.v === 0) throw new Error('domain');
        return { v: domain(power(y.v, 1 / b.v)), pct: false };  // x ʸ√ y : x-th root of y
      }
      return b;
    }
    function postfix() {
      let p = primary();
      while (POST.has(peek())) {
        const k = L[i++].k;
        if (k === '!') p = { v: factorial(p.v), pct: false };
        else if (k === '%') p = { v: p.v / 100, pct: true };
        else if (k === '²') p = { v: p.v * p.v, pct: false };
        else if (k === '³') p = { v: p.v * p.v * p.v, pct: false };
        else if (k === '⁻¹') { if (p.v === 0) throw new Error('div0'); p = { v: 1 / p.v, pct: false }; }
      }
      return p;
    }
    function closeParen() {
      if (peek() === ')') i++;
      else if (peek() !== undefined) throw new Error('syntax');
    }
    function primary() {
      const tok = L[i];
      if (!tok) throw new Error('incomplete');
      i++;
      if (tok.k === 'num') return { v: tok.v, pct: false };
      if (tok.k === 'π') return { v: Math.PI, pct: false };
      if (tok.k === 'e') return { v: Math.E, pct: false };
      if (tok.k === 'Ans') return { v: ans, pct: false };
      if (tok.k === '(') { const v = expr().v; closeParen(); return { v, pct: false }; }
      if (isFunc(tok.k)) { const v = expr().v; closeParen(); return { v: FN[tok.k](v), pct: false }; }
      throw new Error('syntax');
    }

    const res = expr();
    if (i < L.length) throw new Error('syntax');
    if (!Number.isFinite(res.v)) throw new Error(Number.isNaN(res.v) ? 'domain' : 'overflow');
    return res.v;
  }

  // ---------- Formatting (Romanian style: comma decimal, thin-space groups) ----------
  const NNBSP = ' ';
  function fmtNumber(x) {
    if (Object.is(x, -0) || x === 0) return '0';
    const a = Math.abs(x);
    let s;
    if (a >= 1e15 || a < 1e-9) {
      let [m, e] = x.toExponential(10).split('e');
      m = m.replace(/\.?0+$/, '');
      s = m + 'E' + (e.startsWith('+') ? e.slice(1) : e.replace('-', '−'));
      return s.replace('.', ',').replace(/^-/, '−');
    }
    s = String(parseFloat(x.toPrecision(12)));
    if (s.includes('e')) return fmtNumber(parseFloat(s) * (1 + 1e-16));
    let [int, frac] = s.replace('-', '').split('.');
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP);
    return (x < 0 ? '−' : '') + int + (frac ? ',' + frac : '');
  }
  // Turn a formatted result back into input tokens
  function numToTokens(x) {
    const s = fmtNumber(x).replaceAll(NNBSP, '').replace(',', '.');
    const out = [];
    for (const ch of s) out.push(ch === '-' ? '−' : ch);
    return out;
  }

  const ERR = { div0: 'Împărțire la zero', domain: 'Valoare nedefinită', overflow: 'Număr prea mare', syntax: 'Expresie invalidă', incomplete: 'Expresie incompletă' };

  // ---------- Input logic ----------
  const last = () => tokens[tokens.length - 1];
  const openCount = () => tokens.reduce((n, t) => n + (t === '(' || isFunc(t) ? 1 : t === ')' ? -1 : 0), 0);

  function currentNumberHas(ch) {
    for (let i = tokens.length - 1; i >= 0; i--) {
      const t = tokens[i];
      if (t === ch) return true;
      if (!isNumChar(t) && !(t === '−' && tokens[i - 1] === 'E')) return false;
    }
    return false;
  }

  function startFromAnswer() {
    tokens = ['Ans'];
  }

  function input(t) {
    if (done) {
      done = false;
      if (BIN.has(t) || POST.has(t)) startFromAnswer();
      else tokens = [];
    }
    const prev = last();

    if (/^[0-9]$/.test(t)) {
      if (prev && (CONST.has(prev) || prev === ')' || POST.has(prev))) tokens.push('×');
      if (prev === '0' && tokens.length === 1) tokens.pop();
      tokens.push(t);
    } else if (t === '.') {
      if (currentNumberHas('.') || currentNumberHas('E')) return;
      if (prev && (CONST.has(prev) || prev === ')' || POST.has(prev))) tokens.push('×');
      if (!prev || !/^[0-9]$/.test(prev)) tokens.push('0');
      tokens.push('.');
    } else if (t === 'E') {
      if (!prev || !/^[0-9.]$/.test(prev) || currentNumberHas('E')) return;
      tokens.push('E');
    } else if (BIN.has(t)) {
      if (t === '−') {
        if (prev === '−' || prev === '+') tokens.pop();
        tokens.push('−');            // binary or unary minus (also after E)
        return;
      }
      if (!prev) { if (history.length) { startFromAnswer(); tokens.push(t); } return; }
      if (prev === '(' || isFunc(prev) || prev === 'E') return;
      if (BIN.has(prev)) {
        tokens.pop();
        if (BIN.has(last())) tokens.pop();
        if (!tokens.length) return;
      }
      tokens.push(t);
    } else if (POST.has(t)) {
      if (!endsValue(prev) || prev === '.') return;
      tokens.push(t);
    } else if (t === ')') {
      if (openCount() <= 0 || !endsValue(prev)) return;
      tokens.push(')');
    } else if (CONST.has(t) || isFunc(t) || t === '(') {
      if (prev === 'E') return;
      if (endsValue(prev)) tokens.push('×');
      tokens.push(t);
    }
  }

  function backspace() {
    if (done) { done = false; return; }
    tokens.pop();
  }

  function clearAll() { tokens = []; done = false; lastResult = null; }

  function negate() {
    if (done) { done = false; startFromAnswer(); }
    if (!tokens.length) { tokens = ['−']; return; }
    // find start of the trailing operand (number, constant, or postfix chain)
    let i = tokens.length - 1;
    if (!endsValue(tokens[i])) {
      if (last() === '−') tokens.pop(); else input('−');
      return;
    }
    while (i > 0 && POST.has(tokens[i])) i--;
    if (tokens[i] === ')') {
      let depth = 0;
      for (; i >= 0; i--) {
        if (tokens[i] === ')') depth++;
        else if (tokens[i] === '(' || isFunc(tokens[i])) { depth--; if (depth === 0) break; }
      }
    } else if (/^[0-9.]$/.test(tokens[i])) {
      while (i > 0 && (isNumChar(tokens[i - 1]) || (tokens[i - 1] === '−' && tokens[i - 2] === 'E'))) i--;
    }
    if (i < 0) i = 0;
    const before = tokens[i - 1];
    const unaryPos = i - 1 === 0 || BIN.has(tokens[i - 2]) || tokens[i - 2] === '(' || isFunc(tokens[i - 2]);
    if (before === '−' && unaryPos) tokens.splice(i - 1, 1);
    else if (before === '+') tokens.splice(i - 1, 1, '−');
    else if (before === '−') tokens.splice(i - 1, 1, '+');
    else tokens.splice(i, 0, '−');
  }

  function equals() {
    if (done || !tokens.length) return;
    try {
      const v = evaluate(tokens);
      const exprText = plainText(tokens) + ')'.repeat(Math.max(0, openCount()));
      ans = v;
      lastResult = { ok: true, v };
      done = true;
      history.unshift({ e: exprText, r: fmtNumber(v) });
      history = history.slice(0, 60);
      store.set('history', history);
      store.set('ans', ans);
    } catch (err) {
      errMsg = ERR[err.message] || 'Eroare';
    }
  }
  let errMsg = null;

  // ---------- Rendering ----------
  const $ = id => document.getElementById(id);
  const exprEl = $('expr'), resEl = $('result'), screen = $('screen');

  function show(t) {
    if (t === '.') return ',';
    if (t === 'E') return 'E';
    if (t === 'ʸ√') return 'ʸ√';
    return t;
  }
  function plainText(ts) {
    let s = '';
    for (const t of ts) s += show(t);
    return s;
  }
  function cls(t) {
    if (BIN.has(t)) return 'o';
    if (isFunc(t)) return 'f';
    if (t === '(' || t === ')') return 'p';
    return '';
  }
  function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  function render() {
    const shownTokens = done && !tokens.length ? [] : tokens;
    let html = '';
    for (const t of shownTokens) {
      const c = cls(t);
      html += c ? `<span class="${c}">${esc(show(t))}</span>` : esc(show(t));
    }
    const missing = Math.max(0, openCount());
    if (missing && !done) html += `<span class="ghost">${')'.repeat(missing)}</span>`;
    if (!shownTokens.length && !done) html = '0';
    exprEl.innerHTML = html + '<span class="caret"></span>';

    screen.classList.toggle('done', done);
    resEl.classList.remove('err');
    if (errMsg) {
      resEl.textContent = errMsg; resEl.classList.add('err');
    } else if (done && lastResult) {
      resEl.textContent = '= ' + fmtNumber(lastResult.v);
    } else {
      let preview = '';
      const simple = tokens.every(t => isNumChar(t));
      if (tokens.length && !simple) {
        try { preview = '= ' + fmtNumber(evaluate(tokens)); } catch { preview = ''; }
      }
      resEl.textContent = preview;
    }

    // auto-fit font sizes
    const len = exprEl.textContent.length;
    const w = exprEl.clientWidth || 320;
    const fit = (chars, max, min) => Math.max(min, Math.min(max, (w / Math.max(chars, 1)) * 1.62));
    screen.style.setProperty('--fs-expr', fit(len, mode === 'sci' ? 36 : 44, 22) + 'px');
    screen.style.setProperty('--fs-res', fit(resEl.textContent.length, mode === 'sci' ? 40 : 52, 22) + 'px');
    exprEl.scrollLeft = exprEl.scrollWidth;
    resEl.scrollLeft = 0;

    $('clearKey').textContent = tokens.length && !done ? 'C' : 'AC';
    $('angleChip').textContent = deg ? 'DEG' : 'RAD';
    $('angleChip').classList.toggle('on', mode === 'sci');
    $('angleKey').textContent = deg ? 'RAD' : 'DEG';
    $('angleKey').setAttribute('aria-label', deg ? 'Comută în radiani' : 'Comută în grade');
    $('secondChip').hidden = !second;
    $('secondChip').classList.toggle('on', second);

    store.set('draft', { t: tokens, d: done, v: done && lastResult ? lastResult.v : null });
  }

  function renderSecond() {
    document.querySelectorAll('#sciPad [data-t2]').forEach(b => {
      if (!b.dataset.l1) b.dataset.l1 = b.innerHTML;
      b.innerHTML = second ? b.dataset.l2 : b.dataset.l1;
    });
    document.querySelector('[data-act="second"]').setAttribute('aria-pressed', String(second));
  }

  function setMode(m) {
    mode = m;
    store.set('mode', m);
    $('modeClassic').setAttribute('aria-pressed', String(m === 'classic'));
    $('modeSci').setAttribute('aria-pressed', String(m === 'sci'));
    $('sciPad').hidden = m !== 'sci';
    $('app').classList.toggle('sci-on', m === 'sci');
    render();
  }

  function renderHistory() {
    const list = $('histList');
    if (!history.length) {
      list.innerHTML = '<li class="empty">Niciun calcul încă.<br>Rezultatele apar aici după ce apeși =.</li>';
      return;
    }
    list.innerHTML = history.map((h, i) =>
      `<li><button type="button" data-i="${i}"><span class="he">${esc(h.e)} =</span><span class="hr">${esc(h.r)}</span></button></li>`
    ).join('');
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1300);
  }

  // Inside the Android app, window.AbacAndroid is the native bridge (haptics, clipboard)
  const native = window.AbacAndroid || null;
  const buzz = () => {
    try { if (native) native.tap(); else if (navigator.vibrate) navigator.vibrate(6); } catch { /* not supported */ }
  };

  // ---------- Events ----------
  function press(btn) {
    const act = btn.dataset.act;
    let t = btn.dataset.t;
    errMsg = null;
    if (second && btn.dataset.t2) t = btn.dataset.t2;
    if (act === 'clear') clearAll();
    else if (act === 'back') backspace();
    else if (act === 'neg') negate();
    else if (act === 'eq') equals();
    else if (act === 'second') { second = !second; renderSecond(); }
    else if (act === 'angle') { deg = !deg; store.set('deg', deg); }
    else if (act === 'rand') { if (done) { done = false; tokens = []; } if (endsValue(last())) tokens.push('×'); tokens.push(...numToTokens(Math.round(Math.random() * 1e6) / 1e6)); }
    else if (t) input(t);
    render();
  }

  document.querySelectorAll('.pad .k').forEach(btn => {
    btn.addEventListener('click', () => { buzz(); press(btn); });
  });

  // Long-press backspace clears everything
  (() => {
    const b = document.querySelector('[data-act="back"]');
    let timer;
    const start = () => { timer = setTimeout(() => { clearAll(); render(); buzz(); timer = null; }, 550); };
    const stop = () => clearTimeout(timer);
    b.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => b.addEventListener(e, stop));
  })();

  $('modeClassic').addEventListener('click', () => setMode('classic'));
  $('modeSci').addEventListener('click', () => setMode('sci'));

  resEl.addEventListener('click', () => {
    const text = resEl.textContent.replace(/^= /, '');
    if (!text || resEl.classList.contains('err')) return;
    const plain = text.replaceAll(NNBSP, '');
    const ok = () => toast('Copiat: ' + plain);
    if (native) { native.copy(plain); ok(); return; }
    try {
      navigator.clipboard.writeText(plain).then(ok, () => toast(plain));
    } catch { toast(plain); }
  });

  $('histBtn').addEventListener('click', () => { renderHistory(); $('sheet').hidden = !$('sheet').hidden; });
  $('histClose').addEventListener('click', () => { $('sheet').hidden = true; });
  // Android back button: close the history first, otherwise let the app exit
  window.abacBack = () => {
    if ($('sheet').hidden) return false;
    $('sheet').hidden = true;
    return true;
  };
  $('histClear').addEventListener('click', () => {
    history = []; store.set('history', history); renderHistory(); toast('Istoric golit');
  });
  $('histList').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    const h = history[+b.dataset.i];
    const v = parseFloat(h.r.replaceAll(NNBSP, '').replace(',', '.').replace('−', '-').replace('E', 'e'));
    if (done) { done = false; tokens = []; }
    if (endsValue(last())) tokens.push('×');
    tokens.push(...numToTokens(v));
    $('sheet').hidden = true;
    render();
  });

  // Physical keyboard
  const KEYMAP = { '*': '×', 'x': '×', '/': '÷', ':': '÷', '-': '−', '+': '+', '^': '^', '(': '(', ')': ')', '!': '!', '%': '%', ',': '.', '.': '.', 'p': 'π', 'e': 'e', 's': 'sin(', 'c': 'cos(', 't': 'tan(', 'l': 'ln(', 'r': '√(' };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    let handled = true;
    errMsg = null;
    if (/^[0-9]$/.test(k)) input(k);
    else if (KEYMAP[k]) input(KEYMAP[k]);
    else if (k === 'Enter' || k === '=') equals();
    else if (k === 'Backspace') backspace();
    else if (k === 'Escape' || k === 'Delete') clearAll();
    else handled = false;
    if (handled) { e.preventDefault(); render(); }
  });

  window.addEventListener('resize', render);

  // Pick up where the last session left off; the very first time, open on an example
  const draft = store.get('draft', null);
  if (draft && Array.isArray(draft.t)) {
    tokens = draft.t.filter(t => typeof t === 'string' && t.length <= 8);
    if (draft.d && typeof draft.v === 'number') { done = true; lastResult = { ok: true, v: draft.v }; }
  } else if (!store.get('seen', false)) {
    tokens = ['1', '2', '×', '(', '7', '+', '5', ')'];
    store.set('seen', true);
  }
  setMode(mode);
  renderSecond();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !native) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
